name: Tests

on:
  push:
    branches: [ '2.x', 'main' ]
  pull_request:
    branches: [ '2.x', 'main' ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - php: 8.1
            laravel: '^10.0'
            testbench: '^8.0'
            phpunit: '^11.0'
          - php: 8.2
            laravel: '^10.0'
            testbench: '^8.0'
            phpunit: '^11.0'
          - php: 8.3
            laravel: '^10.0'
            testbench: '^8.0'
            phpunit: '^12.3'
          - php: 8.4
            laravel: '^10.0'
            testbench: '^8.0'
            phpunit: '^12.3'
          - php: 8.2
            laravel: '^11.0'
            testbench: '^9.0'
            phpunit: '^11.0'
          - php: 8.3
            laravel: '^11.0'
            testbench: '^9.0'
            phpunit: '^12.3'
          - php: 8.4
            laravel: '^11.0'
            testbench: '^9.0'
            phpunit: '^12.3'
          - php: 8.3
            laravel: '^12.0'
            testbench: '^10.6'
            phpunit: '^12.3'
          - php: 8.4
            laravel: '^12.0'
            testbench: '^10.6'
            phpunit: '^12.3'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
          composer require "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update --dev
          composer update --prefer-dist --no-progress --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/phpunit
