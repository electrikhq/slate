name: release-please
on:
  push:
    branches:
      - 2.x

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Use 'node' for JS/TS projects, or 'simple' for general repos
          release-type: simple 
          token: ${{ secrets.GITHUB_TOKEN }}
