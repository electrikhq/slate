name: Deploy Slate MCP Worker

# Manual only — avoids failure-mail spam when Cloudflare token lacks Workers Routes
# permission (custom domain). Re-enable path filters after the token can manage
# mcp.slate.electrik.dev routes.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/worker

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mcp/worker
          command: deploy
